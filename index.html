<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Base44 APP</title>
  </head>
  <body>
    <script>
      // Applica il tema PRIMA del rendering React per evitare flash
      (function() {
        var theme = 'dark';
        try { theme = localStorage.getItem('app_theme_mode') || 'dark'; } catch(e) {}
        document.body.classList.add('theme-' + theme);
        // Inietta style tag con !important per vincere su qualsiasi CSS caricato dopo
        var s = document.createElement('style');
        if (theme === 'light') {
          s.textContent = 'html,body{background-color:#fef200!important;color:#1e293b!important}';
        } else {
          s.textContent = 'html,body{background-color:#0a0f1a!important;color:#fff!important}';
        }
        s.id = 'theme-flash-guard';
        document.head.appendChild(s);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
